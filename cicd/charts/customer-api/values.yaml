replicaCount: 2

image:
  repository: customer-api
  tag: "latest"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

containerPort: 8080

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

config:
  aspnetcoreEnvironment: Production

database:
  host: postgres
  port: 5432
  name: customerdb
  existingSecret: customer-api-db
  usernameKey: POSTGRES_USER
  passwordKey: POSTGRES_PASSWORD

postgresql:
  fullnameOverride: postgres
  auth:
    database: customerdb
    existingSecret: customer-api-db
    secretKeys:
      adminPasswordKey: POSTGRES_PASSWORD