name: build-test
on:
  workflow_call:
    inputs:
      dotnet-version: 
        type: string
        default: '10.0.x'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - run: dotnet restore CustomerApi.slnx
      - run: dotnet build CustomerApi.slnx -c Release --no-restore
      - run: dotnet test CustomerApi.slnx -c Release --no-build
