name: build-test
on:
  workflow_call:
    inputs:
      dotnet-version: 
        type: string
        default: '10.0.x'

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - name: Restore
        run: dotnet restore CustomerApi.slnx
      - name: Build
        run: dotnet build CustomerApi.slnx -c Release --no-restore
      - name: Test
        run: dotnet test CustomerApi.slnx -c Release --no-build
