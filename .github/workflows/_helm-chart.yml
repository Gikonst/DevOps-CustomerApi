name: helm-chart
on:
  workflow_call:
    inputs:
      chart-path:
        type: string
        default: infrastructure/charts/customer-api

jobs:
  helm:
    name: Lint and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Download chart dependencies
        run: helm dependency build ${{ inputs.chart-path}}
      - name: Lint chart
        run: helm lint ${{ inputs.chart-path }}
      - name: Render templates
        run: helm template customer-api ${{ inputs.chart-path }}
      - name: Package chart
        run: helm package ${{ inputs.chart-path }} -d dist
      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz