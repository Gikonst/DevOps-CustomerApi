name: CI/CD
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Runs one after another so tag bumps from quick merges don't collide
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    name: .NET
    uses: ./.github/workflows/_build-test.yml
  
  image:
    name: API image
    needs: build-test
    uses: ./.github/workflows/_docker-image.yml
    permissions: 
      contents: read
      packages: write
    with:
      image-name: customer-api

  migrations-image:
    name: Migrations image
    needs: build-test
    uses: ./.github/workflows/_docker-image.yml
    permissions: 
      contents: read
      packages: write
    with:
      image-name: customer-api-migrations
      target: migrations
      
  helm:
    name: Helm chart
    needs: build-test
    uses: ./.github/workflows/_helm-chart.yml

  deploy-dev:
    name: Deploy to dev
    needs: [image, migrations-image, helm]
    uses: ./.github/workflows/_bump-tag.yml
    permissions:
      contents: write
    with:
      values-file: infrastructure/charts/customer-api/values-dev.yaml
      tag: sha-${{ github.sha }}