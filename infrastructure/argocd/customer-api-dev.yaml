apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: customer-api-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Gikonst/DevOps-CustomerApi.git
    targetRevision: master
    path: infrastructure/charts/customer-api
    helm:
      releaseName: customer-api
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true